name: expenseapp
description: "This Aint A Virus Dawg"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  image_picker: ^1.1.2

  google_fonts: ^6.2.1
  mongo_dart: ^0.10.0
  
  pdf: ^3.10.7
  media_store_plus: ^0.1.3
  file_saver: ^0.2.12


  intl: ^0.19.0
  
  objectid: ^4.0.3
  flutter_svg: ^2.0.9
  sqflite: ^2.4.2+1
  postgres: ^3.5.10
  http: ^1.6.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/splash_logo.png
    - lib/asset/JOJO.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash_logo.png
  ios: true
  web: false

